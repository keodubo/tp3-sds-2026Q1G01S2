[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp3-sds"
version = "0.1.0"
description = "Persistent wiki and System 1 event-driven hard-sphere foundation for SDS TP3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8,<4"]

[project.scripts]
tp3 = "tp3_sds.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
